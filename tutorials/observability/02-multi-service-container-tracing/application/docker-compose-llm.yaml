# networks:
#   tracing-net:
#     external: true # $ docker network create tracing-net
#     driver: bridge
# $ docker network connect tracing-net jaeger

networks:
  otel-net:
    external: true

services:
  preprocessing:
    image: hongtringuyen/preprocessing:llm
    ports:
      - "${PREPROCESSING_PORT:-5010}:5010"
    environment:
      DOCKER: "true"
      LOG_LEVEL: "WARNING"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      # OTEL_ENDPOINT: "http://jaeger:4317"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

  ensemble:
    image: hongtringuyen/ensemble:llm
    environment:
      DOCKER: "true"
      # INFO so the resolved backend list is logged at startup -- that line is how
      # you confirm an INFERENCE_BACKENDS edit actually took effect. LOG_LEVEL=DEBUG
      # additionally logs the full per-backend result payload.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      # OTEL_ENDPOINT: "http://jaeger:4317"
      SEND_TO_QUEUE: "false"
      # Ensemble members as name=kind=url. Edit here to add/remove/repoint a
      # backend without rebuilding. kind is "cnn" (raw RGB buffer) or "llm"
      # (JPEG-encoded). Omit to fall back to src/ensemble/ensemble_service.yaml.
      INFERENCE_BACKENDS: >-
        mobilenetv2=cnn=http://mobilenetv2:5012/inference,
        efficientnetb0=cnn=http://efficientnetb0:5012/inference,
        moondream=llm=http://moondream-service:5012/inference
      RABBITMQ_URL: "gateway.cloud-1.svc:30072"
      RABBITMQ_QUEUE_NAME: "object_detection_result"
      RABBITMQ_USERNAME: "admin"
      RABBITMQ_PASSWORD: "adminadminadmin"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

  efficientnetb0:
    image: hongtringuyen/inference:llm_cpu
    command: ["--model", "EfficientNetB0"]
    environment:
      LOG_LEVEL: "WARNING"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      # OTEL_ENDPOINT: "http://jaeger:4317"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

  mobilenetv2:
    image: hongtringuyen/inference:llm_cpu
    command: ["--model", "MobileNetV2"]
    environment:
      LOG_LEVEL: "WARNING"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      # OTEL_ENDPOINT: "http://jaeger:4317"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

  # Adapter exposing an Ollama/vLLM model on the same /inference contract as the
  # CNN services. Talks to an Ollama on the host by default; overlay
  # deployment/llm/docker-compose.ollama.yaml to run the engine in a container.
  llava-service:
    image: hongtringuyen/llm_service:llm
    environment:
      LLM_BACKEND: "ollama"
      LLM_BASE_URL: "http://host.docker.internal:11434"
      LLM_MODEL: "llava:7b"
      LLM_PROMPT: "${LLM_PROMPT:-Describe this image.}"
      LOG_LEVEL: "INFO"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      #OTEL_ENDPOINT: "http://jaeger:4317"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

  moondream-service:
    image: hongtringuyen/llm_service:llm
    environment:
      LLM_BACKEND: "ollama"
      LLM_BASE_URL: "http://host.docker.internal:11434"
      LLM_MODEL: "${LLM_MODEL:-moondream-fast}"
      LLM_PROMPT: "${LLM_PROMPT:-Describe this image.}"
      LOG_LEVEL: "INFO"
      MANUAL_TRACING: "true"
      OTEL_ENDPOINT: "http://otelcol:4317"
      # OTEL_ENDPOINT: "http://jaeger:4317"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   - otel-collector
    networks:
      - otel-net

