global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "agent_service"
    metrics_path: /metrics/
    static_configs:
      - targets: ["agent_service:8001"]

  - job_name: "human_service"
    metrics_path: /metrics/
    static_configs:
      - targets: ["human_service:8002"]

  - job_name: "detection_service"
    metrics_path: /metrics/
    static_configs:
      - targets: ["detection_service:8000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
